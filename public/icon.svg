<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Background squircle (Samsung One UI style icon) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle circular glow -->
  <circle cx="256" cy="256" r="180" fill="#38bdf8" opacity="0.08" />

  <!-- Main device/wallet shape with shadow -->
  <g filter="url(#shadow)">
    <!-- Main Card Body -->
    <rect x="96" y="140" width="320" height="210" rx="28" fill="#1e293b" stroke="#334155" stroke-width="4" />
    <!-- Gradient Top Header Strip -->
    <rect x="96" y="140" width="320" height="56" rx="28" fill="url(#cardGrad)" />
    <rect x="96" y="170" width="320" height="26" fill="url(#cardGrad)" />
    
    <!-- Chip -->
    <rect x="136" y="224" width="44" height="34" rx="8" fill="#fbbf24" opacity="0.9" />
    
    <!-- SMS Speech bubble overlay indicating SMS banking -->
    <g transform="translate(230, 215)">
      <rect x="0" y="0" width="150" height="96" rx="20" fill="#0284c7" />
      <polygon points="120,96 135,116 100,96" fill="#0284c7" />
      <!-- Message lines -->
      <line x1="24" y1="32" x2="126" y2="32" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
      <line x1="24" y1="52" x2="90" y2="52" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
      <!-- Debit arrow indicator -->
      <path d="M 120 62 L 134 76 M 134 76 L 134 65 M 134 76 L 123 76" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
  
  <!-- Floating Green Credit Indicator -->
  <g transform="translate(110, 310)" filter="url(#shadow)">
    <circle cx="36" cy="36" r="36" fill="#10b981" />
    <path d="M 36 48 L 36 24 M 36 24 L 26 34 M 36 24 L 46 34" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
